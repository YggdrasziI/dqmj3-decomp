# Dragon Quest Monsters: Joker 3 (Japan), product code CTR-P-BJ3J,
# title ID 000400000016AD00, remaster version 0, internal name "break".
name = "dqmj3"
version = "jpn"

# Decompressed ExeFS .code (ctrtool --exefsdir=... --decompresscode)
object = "orig/jpn/code.bin"
hash = "0d9795cacac26c967390f02355dc409132227553"

symbols = "config/jpn/symbols.txt"
splits = "config/jpn/splits.txt"

# Segment layout from the extended header (exheader.bin, SHA-1
# dd5ad9e5bce006492aa449837f8b2a2594bfdee0).
# The file offset of a section is its address minus the address of .text.
# .bss follows the data segment directly: 0x007CF000 + 0x54EAC.

[[sections]]
name = ".text"
type = "code"
address = 0x00100000
size = 0x61E34C

[[sections]]
name = ".rodata"
type = "rodata"
address = 0x0071F000
size = 0xAF2DC

[[sections]]
name = ".data"
type = "data"
address = 0x007CF000
size = 0x54EAC

[[sections]]
name = ".bss"
type = "bss"
address = 0x00823EAC
size = 0x25504

# String pools: armcc 4.1 b921 puts strings that data refers to in .conststring /
# .constwstring (mergeable), which armlink merged into one pool each. Evidence in
# notes/SPLITS.md: no duplicate string, every string pointer from .data but one
# follows armlink's choice (tools/ctr/strpool.py). The narrow pool holds sections
# with 4-byte alignment (zero padding) and 0xFF fill between sections; 0xFF bytes
# bound it on both sides.

[[string_pools]]
section = ".conststring"
address = 0x007B1D7C
size = 0x12712
char_size = 1

[[string_pools]]
section = ".constwstring"
address = 0x007CAB34
size = 0x156E
char_size = 2

# Functions armlink inlined into every caller (--inline) and then removed as unused,
# with the one instruction of their body before `bx lr`. Calls to them are replaced
# by that instruction (tools/ctr/linker.py), and the object that defines one must
# compile it to exactly that body.
#
# SQFuncState::GetStackSize (squirrel/sqfuncstate.cpp): SQCompiler::Compile calls it
# twice in the source and has `ldr r0, [r0, #0x8]` there (0x00170CD0, 0x00170E30);
# none of the three functions of the image with that body is called by a bl, and two
# of them are in vtables (GetStackSize is not virtual).

[[inlined_functions]]
symbol = "_ZN11SQFuncState12GetStackSizeEv"
instruction = 0xE5900008

# An empty function that the CTR-SDK calls as f(0, <constant>) at the start of library
# functions (0x0400028B in zlib's inflateInit2_ and deflateInit2_); every call was inlined
# to mov r0, r0 and its body removed. The name is this project's convention (fn_inline_
# and the address of the first call site, 0x00104C54), not evidence: notes/COMPILER.md.
# An instruction of bx lr (0xE12FFF1E) is an empty function.
[[inlined_functions]]
symbol = "fn_inline_00104C54"
instruction = 0xE12FFF1E

# Static initializer table: 2,105 words at the end of .rodata, each the offset from
# the word to an initializer function (+1 for Thumb). 2,103 point to the start of a
# function in symbols.txt. Evidence in notes/SPLITS.md.

[init_array]
address = 0x007CC1F8
size = 0x20E4

# Library regions: the blocks of .text that keep their own link order (not sorted by
# name with the game). Each id is a progress category of configure.py. Evidence and the
# uncertainty of each edge in notes/SPLITS.md ("Region map"). The rest of .text is
# name-sorted runs where game and library functions alternate: it is attributed unit by
# unit, not by address.

# RVCT C library and start-up code: __ctr_start, memcmp, strtol, strtoul, strstr,
# __2sprintf...; 202 of the 332 Thumb functions; ends with the last Thumb function.
[[regions]]
id = "sdk"
name = "C library and start-up"
start = 0x00100000
end = 0x00104AF8

# RVCT C library, second part: __rt_ctype_table, strlen, malloc, __aeabi_idivmod,
# __aeabi_memcpy, __aeabi_memclr4, free, tolower, __aeabi_atexit; the other 130 Thumb
# functions; ends with the last Thumb function.
[[regions]]
id = "sdk"
name = "C library"
start = 0x002FE18C
end = 0x003041E0

# Network libraries: a call-graph block (first and last function linked to it) with the
# CTR-SDK clients of ac:u, cecd:u, ssl:C, boss:U, http:C, soc:U and frd:u, NEX (NEX_3_9_1)
# and PIA.
[[regions]]
id = "net"
name = "Network libraries"
start = 0x003E0AE4
end = 0x004C6250
